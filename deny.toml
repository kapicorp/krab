# cargo-deny: what krab is allowed to depend on.
#
# .github/workflows/ci.yml runs every check as a hard failure on pull requests
# that change the dependency set. .github/workflows/advisories.yml repeats the
# advisories check weekly, for advisories published after a merge.

[graph]
all-features = true

[licenses]
# Every licence currently in the tree. krab ships as an Apache-2.0 binary, so
# a new dependency under anything else is a decision, not an accident.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# krab's own crates depend on each other by path and carry no version, which
# reads as a wildcard. They are not published, so there is nothing to pin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# `ignore` is for an advisory that has been read and accepted. Each entry says
# why and when it was looked at (CLI-63).
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa: Marvin timing side channel, no fixed release. krab only generates keys and signs GCP service-account token requests locally, which gives an attacker no decryption or signing oracle to time. Checked 2026-10-29." },
]
