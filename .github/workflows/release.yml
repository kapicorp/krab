# Builds the release artifacts and attaches them to the GitHub release.
#
# Pushing a tag `vX.Y.Z` (matching the workspace version in Cargo.toml)
# builds the `krab` binary for Linux (x86_64, aarch64; glibc 2.17+) and
# macOS (Intel, Apple silicon), packages the VS Code extension, and creates
# the release with notes from the commit log, or uploads to it if it exists.
# The same targets are built as `krab` wheels and published to PyPI.
# Tags with a pre-release suffix (`v2.0.0-alpha.1`) are marked pre-release.
#
# Run it by hand (workflow_dispatch) to build the artifacts from any branch
# without publishing a release; they are kept as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release build per tag at a time, and never cancel one: a half-uploaded
# release is worse than a redundant build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "krab") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

  binary:
    name: krab (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: the oldest glibc the binary may need. cargo-zigbuild links
          # against that version's symbols whatever the runner has.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            glibc: "2.17"
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - if: ${{ !matrix.glibc }}
        run: cargo build --release --locked -p krab --target ${{ matrix.target }}
      - if: ${{ matrix.glibc }}
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-zigbuild@0.23.4
      # cargo-zigbuild runs zig through `python3 -m ziglang` when no `zig` is
      # on PATH; the ziglang wheel is the Zig project's own build.
      - if: ${{ matrix.glibc }}
        run: python3 -m pip install ziglang==0.16.0
      - if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: cargo zigbuild --release --locked -p krab --target "$TARGET.$GLIBC"
      - name: Needs at most glibc ${{ matrix.glibc }}
        if: ${{ matrix.glibc }}
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          highest=$(objdump -T "target/$TARGET/release/krab" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version: $highest"
          if [ -z "$highest" ] || [ "$(printf '%s\n' "$highest" "GLIBC_$GLIBC" | sort -V | tail -1)" != "GLIBC_$GLIBC" ]; then
            echo "::error::krab needs $highest, above the glibc $GLIBC floor"
            exit 1
          fi
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="krab-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/krab" LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krab-${{ matrix.target }}
          path: krab-*.tar.gz
          if-no-files-found: error
      # The binary as a PyPI wheel (pyproject.toml). On Linux maturin links
      # with zig against glibc 2.17 too, using the ziglang installed above.
      - name: Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.glibc && '2_17' || '' }}
          args: --release --locked --out wheels ${{ matrix.glibc && '--zig' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache here: this job's output is published, and a cache
      # entry poisoned by an earlier run would ride along into the release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krab-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, binary, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing through Sigstore, for the attestation below.
      id-token: write
      attestations: write
    steps:
      # git-cliff reads the whole history to find what changed since the
      # previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: krab-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      # Records in a public transparency log which workflow, at which commit,
      # produced these files. `gh attestation verify` checks it.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/krab-*
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: git-cliff
      - name: Release notes
        run: git cliff --latest --strip header --output NOTES.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file NOTES.md "${flags[@]}"
          fi

  pypi:
    name: PyPI
    if: startsWith(github.ref, 'refs/tags/')
    # Only after the GitHub release exists: a PyPI upload cannot be undone.
    needs: release
    runs-on: ubuntu-latest
    # The trusted publisher registered on PyPI names this environment
    # (CONTRIBUTING.md, Publishing).
    environment: pypi
    permissions:
      # Trusted publishing: PyPI trades this job's OIDC token for a
      # short-lived upload token. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
